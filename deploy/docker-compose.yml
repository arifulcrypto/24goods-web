# 24goods demo / single-host stack.
#
#   PUBLIC_BASE_URL=http://<ip> ./deploy/bootstrap.sh       # once: deploy/.env, deploy/env/*, deploy/secrets/*
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile demo up -d --wait
#
# Least privilege (security review H1/M2):
#   * each container gets ONLY its own env file (deploy/env/<service>.env)
#   * Redis ACL users per role; the default user is disabled
#   * Postgres: superuser only for initdb; app_owner is NOSUPERUSER (bound by FORCE RLS)
# Networks:
#   edge     10.89.10.0/24 – Caddy (fixed .10 = the only trusted proxy) <-> api / mockpay
#   backend  10.89.11.0/24 – internal:true (no internet egress): postgres, redis, api, delivery, mockpay, mockusdt
#   usdt     10.89.12.0/24 – api <-> bepusdt only (profile "usdt"); bepusdt needs chain-RPC egress,
#                            has NO published port and NO Caddy route (admin via SSH tunnel)
# NOTE: Docker-published ports bypass UFW. Never add `ports:` to anything but `web`.

name: goods24

x-app: &app
  image: ${API_IMAGE:-ghcr.io/arifulcrypto/goods24-api:main}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?run deploy/bootstrap.sh}
      POSTGRES_DB: postgres
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?run deploy/bootstrap.sh}
    command: >
      postgres -c shared_buffers=24MB -c work_mem=2MB -c maintenance_work_mem=16MB
      -c max_connections=40 -c effective_cache_size=64MB -c wal_buffers=1MB
      -c password_encryption=scram-sha-256 -c log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goods24"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 24mb --maxmemory-policy noeviction
      --aclfile /run/secrets/redis_acl
    environment:
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?run deploy/bootstrap.sh}
    secrets: [redis_acl]
    volumes: [redisdata:/data]
    networks: [backend]
    mem_limit: 48m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user health --pass \"$${REDIS_HEALTH_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: [env/migrate.env]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    <<: *app
    restart: "no"
    command: ["python", "-m", "app.devtools.seed"]
    env_file: [env/seed.env]
    volumes: [uploads:/data/uploads]
    secrets: [vault_public_keys]
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api:
    <<: *app
    command: ["python", "-m", "app.serve"]
    env_file: [env/api.env]
    volumes: [uploads:/data/uploads]
    secrets: [vault_public_keys]          # public key only: can seal, cannot open
    networks:
      edge: {}
      backend: {}
      usdt: {}                            # reaches bepusdt (when the "usdt" profile runs)
    mem_limit: 192m
    depends_on:
      seed: { condition: service_completed_successfully }

  delivery:
    <<: *app
    command: ["python", "-m", "app.delivery"]
    env_file: [env/delivery.env]
    secrets: [vault_private_keys]         # the ONLY container holding private keys
    networks: [backend]                   # internal network only: no internet egress
    mem_limit: 112m
    depends_on:
      seed: { condition: service_completed_successfully }

  mockpay:                                # ZPay simulator — demo/CI only (profile "demo")
    <<: *app
    profiles: [demo]
    command: ["python", "-m", "app.devtools.mock_zpay"]
    env_file: [env/mockpay.env]
    networks:
      edge: {}
      backend: {}
    mem_limit: 96m
    depends_on:
      redis: { condition: service_healthy }

  mockusdt:                               # BEpusdt simulator — demo/CI only (profile "demo")
    <<: *app
    profiles: [demo]
    command: ["python", "-m", "app.devtools.mock_bepusdt"]
    env_file: [env/mockusdt.env]
    networks:
      edge: {}
      backend: {}
    mem_limit: 96m
    depends_on:
      redis: { condition: service_healthy }

  bepusdt:                                # real USDT gateway (profile "usdt"); INTERNAL only
    # BEpusdt v1.24.3 = upstream commit 0716485 (Docker Hub has no semver tags)
    image: v03413/bepusdt:0716485@sha256:0a7d859e4f5022c9b53a9ed2fc06db1f3ca254ee40db0bfd72207e26517d0c69
    profiles: [usdt]
    restart: unless-stopped
    env_file: [env/bepusdt.env]           # its own env file (may be empty); no app secrets
    volumes: [bepusdt_data:/var/lib/bepusdt]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [usdt, usdt_egress]         # NO `ports:`, NO Caddy route; egress only for chain RPC
    mem_limit: 160m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ${WEB_IMAGE:-ghcr.io/arifulcrypto/goods24-web:main}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUBLISH_HTTP:-80}:80"
    volumes: [caddy_data:/data, caddy_config:/config]
    networks:
      edge:
        ipv4_address: 10.89.10.10         # == APP_TRUSTED_PROXIES in env/api.env
    mem_limit: 64m
    depends_on: [api]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    ipam:
      config: [{ subnet: 10.89.10.0/24 }]
  backend:
    internal: true
    ipam:
      config: [{ subnet: 10.89.11.0/24 }]
  usdt:                                    # api <-> bepusdt only; never attach other services
    internal: true
    ipam:
      config: [{ subnet: 10.89.12.0/24 }]
  usdt_egress:                             # bepusdt's own route to chain RPC endpoints
    ipam:
      config: [{ subnet: 10.89.13.0/24 }]

volumes:
  pgdata: {}
  redisdata: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
  bepusdt_data: {}

secrets:
  vault_public_keys:
    file: ./secrets/vault_public_keys.json
  vault_private_keys:
    file: ./secrets/vault_private_keys.json
  redis_acl:
    file: ./secrets/users.acl
