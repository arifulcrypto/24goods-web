# 24goods demo / single-host stack.
#
#   ./deploy/bootstrap.sh     # once: generates deploy/.env + deploy/secrets/*
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Network design:
#   edge     – Caddy <-> api/mockpay. The ONLY published port is Caddy's.
#   backend  – internal:true (no internet egress): postgres, redis, api, delivery, mockpay.
# NOTE: Docker-published ports bypass UFW. Never add `ports:` to anything but `web`.

name: goods24

x-app: &app
  image: ${API_IMAGE:-ghcr.io/arifulcrypto/goods24-api:main}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file: [.env]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?run bootstrap.sh}
      POSTGRES_DB: goods24
    command: >
      postgres -c shared_buffers=24MB -c work_mem=2MB -c maintenance_work_mem=16MB
      -c max_connections=40 -c effective_cache_size=64MB -c wal_buffers=1MB
      -c password_encryption=scram-sha-256 -c log_min_duration_statement=500
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d goods24"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 24mb --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?run bootstrap.sh}
    volumes: [redisdata:/data]
    networks: [backend]
    mem_limit: 48m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: ${APP_OWNER_DATABASE_URL}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    <<: *app
    restart: "no"
    command: ["python", "-m", "app.devtools.seed"]
    volumes: [uploads:/data/uploads]
    secrets: [vault_public_keys]
    networks: [backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api:
    <<: *app
    command: ["python", "-m", "app.serve"]
    volumes: [uploads:/data/uploads]
    secrets: [vault_public_keys]          # public key only: can seal, cannot open
    networks: [edge, backend]
    mem_limit: 192m
    depends_on:
      seed: { condition: service_completed_successfully }

  delivery:
    <<: *app
    command: ["python", "-m", "app.delivery"]
    secrets: [vault_private_keys]         # the ONLY container holding private keys
    networks: [backend]                   # internal network only: no internet egress
    mem_limit: 112m
    depends_on:
      seed: { condition: service_completed_successfully }

  mockpay:                                # demo only — ZPay simulator
    <<: *app
    command: ["python", "-m", "app.devtools.mock_zpay"]
    networks: [edge, backend]
    mem_limit: 96m
    depends_on:
      redis: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:-ghcr.io/arifulcrypto/goods24-web:main}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUBLISH_HTTP:-80}:80"
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [edge]
    mem_limit: 64m
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge: {}
  backend:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  vault_public_keys:
    file: ./secrets/vault_public_keys.json
  vault_private_keys:
    file: ./secrets/vault_private_keys.json
