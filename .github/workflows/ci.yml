name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint / test / SAST / SCA
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Tests (incl. RLS, column grants, IDOR, concurrent notify)
        run: pytest -q
      - name: Bandit (Python SAST)
        run: bandit -c pyproject.toml -r app -ll
      - name: pip-audit (runtime dependency CVEs, blocking)
        run: pip-audit --strict --progress-spinner off .
      - name: pip-audit (dev toolchain, advisory)
        continue-on-error: true
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/req.txt"
          pip-audit -r "$RUNNER_TEMP/req.txt" --progress-spinner off

  frontend:
    name: Frontend typecheck / test / build / size budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Bundle budget (web initial JS <= 150 KB gzip)
        run: pnpm --filter web run size
      - name: pnpm audit (advisory)
        continue-on-error: true
        run: pnpm audit --prod

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: >-
          semgrep scan --config p/python --config p/owasp-top-ten --config p/secrets
          --config p/javascript --config p/typescript --config p/vue
          --error --metrics=off

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Build images + Trivy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: web
            context: .
            file: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: goods24-${{ matrix.name }}:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/${{ matrix.name }}.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 3

  e2e:
    name: E2E smoke (full stack, mock data)
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Load images
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
      - name: Bootstrap + start stack
        env:
          API_IMAGE: goods24-api:ci
          WEB_IMAGE: goods24-web:ci
          PUBLISH_HTTP: "8080"
        run: |
          ./deploy/bootstrap.sh
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --wait --wait-timeout 240
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Smoke test (buyer chat -> quote -> pay -> deliver -> reveal)
        run: |
          pip install httpx
          python e2e/smoke.py --base http://127.0.0.1:8080 --env deploy/.env
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --tail 200

  publish:
    name: Push images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [e2e, semgrep, gitleaks]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [api, web]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push (sha + main)
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/goods24-${{ matrix.name }}
          NAME: ${{ matrix.name }}
        run: |
          docker load -i "$RUNNER_TEMP/$NAME.tar"
          docker tag "goods24-$NAME:ci" "$IMG:$GITHUB_SHA"
          docker tag "goods24-$NAME:ci" "$IMG:main"
          docker push "$IMG:$GITHUB_SHA"
          docker push "$IMG:main"
