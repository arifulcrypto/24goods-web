name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas a PR touches. Pushes to main (and manual runs) always run everything, so every
  # published image went through the full pipeline. A skipped job counts as passed for branch
  # protection; the image matrix skips per step instead, because a job-level skip would report
  # the bare job name and leave the per-matrix required checks waiting forever.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all() { for k in backend frontend stack; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" != "pull_request" ]; then all; exit 0; fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          if grep -qE '^\.github/workflows/ci\.yml$' <<<"$files"; then all; exit 0; fi
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          {
            echo "backend=$(has '^backend/')"
            echo "frontend=$(has '^frontend/')"
            echo "stack=$(has '^(backend|frontend|deploy|e2e)/')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend:
    name: Backend lint / test / SAST / SCA
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_REQUIRE_SERVICES: "1"  # fail (not skip) if PG/Redis are missing
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (uv, several times faster than pip; same pyproject inputs)
        run: |
          python -m pip install uv==0.13.7
          uv pip install --system -e '.[dev]'
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Tests (incl. RLS, column grants, IDOR, concurrent notify)
        run: pytest -q --durations=15
      - name: Bandit (Python SAST)
        run: bandit -c pyproject.toml -r app -ll
      - name: pip-audit (runtime dependency CVEs, blocking)
        run: pip-audit --strict --progress-spinner off .
      - name: pip-audit (dev toolchain, advisory)
        continue-on-error: true
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/req.txt"
          pip-audit -r "$RUNNER_TEMP/req.txt" --progress-spinner off

  frontend:
    name: Frontend typecheck / test / build / size budget
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Policy lint (no v-html / CDN / eval / console.log)
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build both apps + bundle budget (web initial JS <= 150 KB gzip)
        run: pnpm build
      - name: pnpm audit (runtime dependencies, blocking at high)
        run: pnpm audit --prod --audit-level high

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: >-
          semgrep scan --config p/python --config p/owasp-top-ten --config p/secrets --config .semgrep
          --config p/javascript --config p/typescript
          --error --metrics=off

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits on pull_request events (read-only).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds in parallel with the test jobs: nothing is pushed until `publish`, which needs them all.
  images:
    name: Build images + Trivy
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      RUN: ${{ needs.changes.outputs.stack }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: web
            context: .
            file: deploy/web.Dockerfile
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.RUN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Patch epoch (ISO week; refreshes cached OS-upgrade layers)
        if: env.RUN == 'true'
        id: epoch
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Build
        if: env.RUN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: goods24-${{ matrix.name }}:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: OS_PATCH_EPOCH=${{ steps.epoch.outputs.week }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
          # layer cache: the xcaddy compile and the dependency installs are rebuilt only when
          # their inputs change (PR branches read main's cache)
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}
      - name: Trivy image scan
        if: env.RUN == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/${{ matrix.name }}.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - if: env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 3
      - name: Nothing to build
        if: env.RUN != 'true'
        run: echo "No backend/frontend/deploy/e2e change in this PR; image build skipped."

  e2e:
    name: E2E smoke (full stack, mock data)
    runs-on: ubuntu-latest
    needs: [changes, images]
    if: needs.changes.outputs.stack == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Load images
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done
      - name: Bootstrap + start stack
        env:
          API_IMAGE: goods24-api:ci
          WEB_IMAGE: goods24-web:ci
          PUBLISH_HTTP: "8080"
        run: |
          ./deploy/bootstrap.sh
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile demo up -d --wait --wait-timeout 300
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Smoke test (buyer chat -> quote -> pay -> deliver -> reveal)
        run: |
          pip install httpx
          python e2e/smoke.py --base http://127.0.0.1:8080 --seed-env deploy/env/seed.env
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile demo logs --tail 200

  publish:
    name: Push images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, semgrep, gitleaks]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [api, web]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push (sha + main)
        env:
          IMG: ghcr.io/${{ github.repository_owner }}/goods24-${{ matrix.name }}
          NAME: ${{ matrix.name }}
        run: |
          docker load -i "$RUNNER_TEMP/$NAME.tar"
          docker tag "goods24-$NAME:ci" "$IMG:$GITHUB_SHA"
          docker tag "goods24-$NAME:ci" "$IMG:main"
          docker push "$IMG:$GITHUB_SHA"
          docker push "$IMG:main"
