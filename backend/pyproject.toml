[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "goods24-backend"
version = "0.1.0"
description = "Security-first virtual goods marketplace API (MVP-0)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.6",
  "cryptography>=50",
  "sqlalchemy[asyncio]>=2.0.57,<2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "redis>=8.1",
  "argon2-cffi>=25.1",
  # 13.0.0 fixes GHSA-78g4-xqwv-q3g8 / CVE-2026-96638/96640/96778 (needs Python >= 3.11).
  # Py3.10 is local-dev only; uploads already restrict decoders to the sniffed format.
  "pillow>=13.0.0; python_version >= '3.11'",
  "pillow>=12.3; python_version < '3.11'",
  "python-multipart>=0.0.32",
  "httpx>=0.28.1",
  "markdown-it-py>=3.0",  # article / usage markdown (HTML disabled) ...
  "nh3>=0.3.0",  # ... then sanitized with an allowlist
  "segno>=1.6,<2",  # pure-Python QR (SVG) for the USDT pay page
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.4",
  "ruff>=0.14",
  "bandit[toml]>=1.9",
  "pip-audit>=2.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends()/Query() defaults are the framework idiom
  "RUF001", # intentional CJK / typographic characters in user-facing strings
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC110"]
"app/devtools/seed_content.py" = ["E501"]  # long prose (EN + zh-CN) lines

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
